name: Publish to PyPI with Trusted Publishing

# A release is started by pushing a version tag, e.g.
#   git tag -a v1.3.0 -m "PyNAFF 1.3.0" && git push origin v1.3.0
# The tag must match PyNAFF/_version.py. The workflow runs the tests, uploads
# to PyPI and, only if the upload succeeds, creates the GitHub release with the
# notes of that version from CHANGELOG.md. It can still be started by hand
# from the Actions tab; on a branch it then uploads without creating a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches PyNAFF/_version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "exec(open('PyNAFF/_version.py').read()); print(__version__)")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in PyNAFF/_version.py"
            exit 1
          fi
          if ! grep -q "^## ${version}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## ${version}'"
            exit 1
          fi

  test:
    needs: check-version
    uses: ./.github/workflows/tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 == v {found=1; next} found && /^## / {exit} found {print}' \
            CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "PyNAFF ${version}" --notes-file notes.md
